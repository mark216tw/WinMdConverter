name: 功能建議
description: 建議實用且符合專案方向的新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用情境或問題
      description: 請描述目前遇到的需求，而不只是指定解法。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
